---
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-json
        fail_fast: true
      - id: pretty-format-json
        exclude_types: [jupyter]
        args: [--autofix, --no-sort-keys]
      - id: requirements-txt-fixer

  - repo: https://github.com/crate-ci/typos
    rev: 276087d9a4f06398b3e04825487805e2d7375888  # frozen: v1.52.2
    hooks:
      - id: typos

  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: 1066584123cce44a99b4818c2b2c4a7e732ff8e9  # frozen: v1.11.3
    hooks:
      - id: tombi-format
        args: [--error-on-warnings]

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: 539ea2e1c5a0eb8adeb5fe0b1e2eb66fa5827042  # frozen: v0.3.5
    hooks:
      - id: rumdl-check
        args: [--fix]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1  # frozen: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 00eaed0068329eb6ca6bcb8de7b46c372d8d1c19  # frozen: 0.13.9
    hooks:
      - id: uv-lock

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: name-tests-test
        args: [--pytest-test-first]
      - id: no-commit-to-branch

  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: 1066584123cce44a99b4818c2b2c4a7e732ff8e9  # frozen: v1.11.3
    hooks:
      - id: tombi-lint
        args: [--error-on-warnings]

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: [--format=standard, --strict]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: f690817de25831a37094ca35af5ada05c909ff1c  # frozen: v4.19.3
    hooks:
      - id: commitizen
      - id: commitizen-branch
