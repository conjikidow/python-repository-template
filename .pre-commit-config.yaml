---
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: cb8c523fd4835aba42af70f4cad5568db4df0b6c  # frozen: v0.16.0
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/crate-ci/typos
    rev: d43b6c087ac471e2ea7b8af622ff15f05c0c365b  # frozen: v1.50.1
    hooks:
      - id: typos
        args: ["--force-exclude"]

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: 2e9b57dbffd7869f0ee8bcdb1978cb1c477cb042  # frozen: v0.2.73
    hooks:
      - id: rumdl
        args: ["--fix"]

  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: 3251597d6d00583a75057ea11da9fcb66a588198  # frozen: v1.5.5
    hooks:
      - id: tombi-format
      - id: tombi-lint

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: ["--strict", "-c=.yamllint.yaml"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: pretty-format-json
        args: ["--autofix", "--no-sort-keys"]
      - id: requirements-txt-fixer
      - id: check-ast
      - id: check-builtin-literals
      - id: debug-statements
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-xml
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-vcs-permalinks
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: no-commit-to-branch

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: eec2b3c4f52295313b08b04f928ab2479e468b5c  # frozen: 0.12.15
    hooks:
      - id: uv-lock

  - repo: https://github.com/commitizen-tools/commitizen
    rev: db073f6e2776db0e634dc8d6c20d4123a1cab086  # frozen: v4.18.1
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages:
          - pre-push
